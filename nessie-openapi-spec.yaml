openapi: 3.0.3
info:
  title: Nessie API
  description: A comprehensive banking API for managing customers, accounts, transactions, and financial operations
  version: 1.0.0
  contact:
    name: Nessie API Support
    url: https://nessieisreal.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Local server
  - url: https://qa-api.nessieisreal.com
    description: QA server
  - url: https://prod-api.nessieisreal.com
    description: Production server
  - url: https://sopko4r0aj.execute-api.us-east-1.amazonaws.com/qa
    description: Direct QA server

security:
  - ApiKeyAuth: []

paths:
  /customers:
    get:
      tags:
        - Customers
      summary: Get all customers
      description: Retrieve all customers for the authenticated user
      security:
        - ApiKeyAuth: []
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
          description: API key for authentication
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
                example: "unauthorized"
    post:
      tags:
        - Customers
      summary: Create a new customer
      description: Create a new customer for the authenticated user
      security:
        - ApiKeyAuth: []
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
          description: API key for authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
      responses:
        '201':
          description: Customer created successfully
          content:
            application/json:
              schema:
                type: string
                example: "Customer created"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
                example: "unauthorized"

  /customers/{id}:
