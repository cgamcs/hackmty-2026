components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: query
      name: key
      description: API key for authentication

  schemas:
    Error:
      type: object
      properties:
        code:
          type: integer
          description: Error code
        message:
          type: string
          description: Error message
        details:
          type: string
          description: Additional error details

    Address:
      type: object
      properties:
        street_number:
          type: string
          description: Street number
        street_name:
          type: string
          description: Street name
        city:
          type: string
          description: City
        state:
          type: string
          description: State
        zip:
          type: string
          description: ZIP code
      required:
        - street_number
        - street_name
        - city
        - state
        - zip

    Geocode:
      type: object
      properties:
        lat:
          type: number
          format: float
          description: Latitude
        lng:
          type: number
          format: float
          description: Longitude
      required:
        - lat
        - lng

    Customer:
      type: object
      properties:
        _id:
          type: string
          description: Customer unique identifier
          minLength: 24
          maxLength: 24
        first_name:
          type: string
          description: Customer's first name
        last_name:
          type: string
          description: Customer's last name
        address:
          $ref: '#/components/schemas/Address'
      required:
        - _id
        - first_name
        - last_name
        - address

    CustomerCreate:
      type: object
      properties:
        first_name:
          type: string
          description: Customer's first name
        last_name:
          type: string
          description: Customer's last name
        address:
          $ref: '#/components/schemas/Address'
      required:
        - first_name
        - last_name
        - address

    CustomerUpdate:
      type: object
      properties:
        first_name:
          type: string
          description: Customer's first name
        last_name:
          type: string
          description: Customer's last name
        address:
          $ref: '#/components/schemas/Address'

    AccountType:
      type: string
      enum: [Credit Card, Savings, Checking]
      description: Type of account

    Account:
      type: object
      properties:
        _id:
          type: string
          description: Account unique identifier
          minLength: 24
          maxLength: 24
        type:
          $ref: '#/components/schemas/AccountType'
        nickname:
          type: string
          description: Nickname associated with account
        rewards:
          type: integer
          minimum: 0
          description: Reward points associated with account
        balance:
          type: integer
          minimum: 0
          description: Balance associated with account
        account_number:
          type: string
          minLength: 16
          maxLength: 16
          description: 16 digit Account Number that is associated with the account
        customer_id:
          type: string
          description: ID of customer who owns the account
      required:
        - _id
